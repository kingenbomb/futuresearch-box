  - generic [ref=f3e172]:
    - main [ref=f3e173]:
      - generic [ref=f3e175]:
        - heading [level=1] [ref=f3e176]:
          - text: AgentRouter 使用规范/ Terms of Use
          - link "Permalink to \"AgentRouter 使用规范/ Terms of Use\"" [ref=f3e177] [cursor=pointer]:
            - /url: "#agentrouter-使用规范-terms-of-use"
            - text: "#"
        - paragraph [ref=f3e178]: 感谢你选择 AgentRouter。我们致力于为真实开发者提供一个可持续的免费 API 服务。由于资源有限且宝贵，我们希望将每一份算力留给真正有需要的人。为此，请你仔细阅读并遵守以下规范。本规范旨在维护社区公平，保障服务的长期稳定运行。
        - heading [level=2] [ref=f3e179]:
          - text: 一、关于不当使用行为
          - link "Permalink to \"一、关于不当使用行为\"" [ref=f3e180] [cursor=pointer]:
            - /url: "#一、关于不当使用行为"
            - text: "#"
        - paragraph [ref=f3e181]: 以下情形属于平台重点关注的不合理使用行为（包括但不限于）：
        - list [ref=f3e182]:
          - listitem [ref=f3e183]:
            - paragraph [ref=f3e184]: 模型蒸馏与训练数据获取：以获取模型输出用于训练、微调、蒸馏其他模型为目的的调用，包括批量生成合成训练语料。
          - listitem [ref=f3e185]:
            - paragraph [ref=f3e186]: 非真实意图的批量操作：包括但不限于通过脚本、自动化程序或多重账号进行批量注册、批量获取初始额度。
          - listitem [ref=f3e187]:
            - paragraph [ref=f3e188]: 以刷取为目的的虚假调用：非出于实际开发或调试需求，仅以获取平台权益（如额度、奖励）或制造使用记录为目标的自动化刷量行为。
          - listitem [ref=f3e189]:
            - paragraph [ref=f3e190]: 商业转售与账号共享：出售、租赁、转让、分发账号或其中包含的API额度，或将本服务直接或间接用于商业倒卖。
          - listitem [ref=f3e191]:
            - paragraph [ref=f3e192]: 欺诈性获取权益：通过虚假账号、伪造邀请关系或其他不正当手段，套取平台发放的邀请奖励或活动福利。
          - listitem [ref=f3e193]:
            - paragraph [ref=f3e194]: 干扰服务正常运行：恶意绕过系统使用限制（如频率、并发）、长时间不间断的自动化轮询、压力测试、伪造上报数据，或采取其他影响服务稳定性、损害其他用户合法权益的行为。
          - listitem [ref=f3e195]:
            - paragraph [ref=f3e196]:
              - emphasis [ref=f3e197]:
                - strong [ref=f3e198]: 将服务用于与平台定位长期不符的场景：平台资源有限且面向开发者编程场景设计，对于大量占用资源但与编程开发无关的使用，平台将根据实际资源情况采取必要的限制措施。此类场景包括但不限于：
            - list [ref=f3e199]:
              - listitem [ref=f3e200]: 以角色扮演为核心的对话应用（如社区常称的“酒馆”类场景）；
              - listitem [ref=f3e201]: 将平台作为通用问答或知识检索工具，以单轮百科查询为主的高频使用（零星查询不受影响，但以此为主要使用方式，说明该场景更适合通用搜索或专用问答产品，建议选用更匹配的工具）；
              - listitem [ref=f3e202]: 以量取胜的内容生产，如批量生成 SEO 文章、营销文案或内容农场式文本。
        - paragraph [ref=f3e203]:
          - emphasis [ref=f3e204]: 注：以上条款为示例性列举，并非穷尽。平台保留根据实际情况综合判定是否构成不当使用的权利。
        - heading [level=3] [ref=f3e205]:
          - text: 关于合法合规使用的特别提示
          - link "Permalink to \"关于合法合规使用的特别提示\"" [ref=f3e206] [cursor=pointer]:
            - /url: "#关于合法合规使用的特别提示"
            - text: "#"
        - paragraph [ref=f3e207]: 此外，严禁将本服务用于任何法律法规禁止的用途，包括但不限于生成违法内容、侵犯他人合法权益、危害网络安全的行为。
        - heading [level=2] [ref=f3e208]:
          - text: 二、关于资源分配
          - link "Permalink to \"二、关于资源分配\"" [ref=f3e209] [cursor=pointer]:
            - /url: "#二、关于资源分配"
            - text: "#"
        - paragraph [ref=f3e210]: 为确保资源合理利用，系统的额度、模型可用性、调用频率等资源，将根据账号的真实、持续使用情况动态调整，并向活跃、有效的真实使用场景倾斜。
        - paragraph [ref=f3e211]: 对于连续长期未产生真实调用记录的账户，系统可能会酌情回收或缩减其闲置资源。
        - paragraph [ref=f3e212]: 具体的评估方式暂不对外公开，以防范恶意绕过，敬请理解。
        - heading [level=2] [ref=f3e213]:
          - text: 三、关于违规处置
          - link "Permalink to \"三、关于违规处置\"" [ref=f3e214] [cursor=pointer]:
            - /url: "#三、关于违规处置"
            - text: "#"
        - paragraph [ref=f3e215]: 平台不会无缘由地处置任何账号，每一次判定都会审慎进行。对于经确认存在不当使用行为的账号，我们将视情节轻重采取包括但不限于调整额度、限制调用、暂停或终止服务等措施。
        - paragraph [ref=f3e216]: 基于安全与反制策略的需要，我们无法披露具体的判定依据与阈值。如果你认为判定有误，可通过agent_router_org@163.com提交申诉，我们会人工复核。
        - paragraph [ref=f3e217]: 此外，本规范及相关判断的最终解释权归平台所有。随着社区发展和对抗环境的变化，我们也会适时修订本规范，以持续守护这个小小的公益空间。
        - heading [level=2] [ref=f3e218]:
          - text: 四、关于正常使用
          - link "Permalink to \"四、关于正常使用\"" [ref=f3e219] [cursor=pointer]:
            - /url: "#四、关于正常使用"
            - text: "#"
        - paragraph [ref=f3e220]: 如果你是一名个人开发者，出于真实开发或工作需求正常使用本服务，以上条款不会对你产生任何负面影响。我们由衷感谢你的理解与支持，也期待你与我们一同维护这个公益社区，让它走得更远。
        - paragraph [ref=f3e221]: —— AgentRouter 团队
        - separator [ref=f3e222]
        - heading [level=2] [ref=f3e223]:
          - text: 📌 English version available below.
          - link "Permalink to \"📌 English version available below.\"" [ref=f3e224] [cursor=pointer]:
            - /url: "#📌-english-version-available-below"
            - text: "#"
        - paragraph [ref=f3e225]: Thank you for choosing AgentRouter. We are committed to providing a sustainable, free API service for genuine developers. Since our computational resources are limited and valuable, we want to ensure every bit of computing power goes to those who truly need it. To that end, please carefully read and adhere to the following guidelines. These policies are designed to maintain fairness within the community and ensure the long-term stability of the service.
        - heading [level=2] [ref=f3e226]:
          - text: I. Regarding Improper Use
          - link "Permalink to \"I. Regarding Improper Use\"" [ref=f3e227] [cursor=pointer]:
            - /url: "#i-regarding-improper-use"
            - text: "#"
        - paragraph [ref=f3e228]: "The following situations are considered improper use and will receive heightened attention from the platform (including but not limited to):"
        - list [ref=f3e229]:
          - listitem [ref=f3e230]:
            - paragraph [ref=f3e231]: "Model Distillation and Training Data Acquisition: Calls made with the intent to obtain model outputs for training, fine-tuning, distilling, or otherwise building other models, including batch generation of synthetic training corpora."
          - listitem [ref=f3e232]:
            - paragraph [ref=f3e233]: "Batch Operations Without Genuine Intent: Including but not limited to batch account registration and batch acquisition of initial credits through scripts, automated programs, or multiple accounts."
          - listitem [ref=f3e234]:
            - paragraph [ref=f3e235]: "Fake Calls for Reward Farming: Automated high-volume requests that are not driven by actual development or debugging needs, but are solely intended to obtain platform benefits (such as credits, rewards) or to generate fake usage records."
          - listitem [ref=f3e236]:
            - paragraph [ref=f3e237]: "Commercial Resale and Account Sharing: Selling, leasing, transferring, distributing accounts or the API credits contained within them, or using the service directly or indirectly for commercial arbitrage."
          - listitem [ref=f3e238]:
            - paragraph [ref=f3e239]: "Fraudulent Acquisition of Benefits: Obtaining referral bonuses, event rewards, or other platform benefits through fake accounts, forged referral relationships, or other improper means."
          - listitem [ref=f3e240]:
            - paragraph [ref=f3e241]: "Interference with Normal Service Operation: Maliciously circumventing system usage limits (e.g., rate limits, concurrency limits), prolonged uninterrupted automated polling, stress testing, forging reported data, or engaging in other activities that compromise service stability or harm the legitimate rights of other users."
          - listitem [ref=f3e242]:
            - paragraph [ref=f3e243]: "Using the Service in Ways Inconsistent with the Platform's Long-Term Positioning: Platform resources are limited and designed primarily for developer programming scenarios. For usage that consumes significant resources but is unrelated to programming development, the platform will take necessary restrictive measures based on actual resource availability. Such scenarios include but are not limited to:"
            - list [ref=f3e244]:
              - listitem [ref=f3e245]: Dialogue applications centered on role-playing (commonly referred to in the community as "Tavern" or similar scenarios);
              - listitem [ref=f3e246]: Using the platform as a general-purpose Q&A or knowledge retrieval tool, with high-frequency usage dominated by single-turn encyclopedia-style queries (occasional queries are not affected, but if this becomes the primary usage pattern, it suggests that general-purpose search engines or dedicated Q&A products would be more suitable tools);
              - listitem [ref=f3e247]: Volume-oriented content production, such as batch generation of SEO articles, marketing copy, or content-farm-style text generation.
        - paragraph [ref=f3e248]: "Note: The above provisions are illustrative examples and are not exhaustive. The platform reserves the right to make comprehensive judgments based on actual circumstances in determining whether improper use has occurred."
        - heading [level=2] [ref=f3e249]:
          - text: II. Regarding Legally Compliant Use
          - link "Permalink to \"II. Regarding Legally Compliant Use\"" [ref=f3e250] [cursor=pointer]:
            - /url: "#ii-regarding-legally-compliant-use"
            - text: "#"
        - paragraph [ref=f3e251]: The service is strictly prohibited from being used for any purposes forbidden by applicable laws and regulations, including but not limited to generating illegal content, infringing upon the legitimate rights of others, or compromising cybersecurity. Any confirmed violations of this nature will be handled in accordance with laws and regulations, and we will cooperate with relevant authorities in pursuing legal liability.
        - heading [level=2] [ref=f3e252]:
          - text: III. Regarding Resource Allocation
          - link "Permalink to \"III. Regarding Resource Allocation\"" [ref=f3e253] [cursor=pointer]:
            - /url: "#iii-regarding-resource-allocation"
            - text: "#"
        - paragraph [ref=f3e254]: To ensure reasonable use of resources, the system will dynamically adjust quotas, model availability, rate limits, and other resources based on the genuine and sustained usage patterns of each account, favoring active and legitimate usage scenarios.
        - paragraph [ref=f3e255]: Accounts that show no genuine call activity for an extended period may have their idle resources reclaimed or reduced at the system's discretion.
        - paragraph [ref=f3e256]: The specific evaluation mechanisms are not publicly disclosed to prevent malicious circumvention. We appreciate your understanding.
        - heading [level=2] [ref=f3e257]:
          - text: IV. Regarding Enforcement Actions
          - link "Permalink to \"IV. Regarding Enforcement Actions\"" [ref=f3e258] [cursor=pointer]:
            - /url: "#iv-regarding-enforcement-actions"
            - text: "#"
        - paragraph [ref=f3e259]: The platform does not take action against any account without cause. Every decision is made with careful consideration. For accounts confirmed to have engaged in improper use, we will take actions proportionate to the severity of the violation, including but not limited to adjusting quotas, restricting calls, suspending access, or terminating the service.
        - paragraph [ref=f3e260]:
          - text: Due to security and countermeasure requirements, we cannot disclose the specific criteria or thresholds used for judgment. If you believe a decision was made in error, you may submit an appeal via
          - link "agent_router_org@163.com" [ref=f3e261] [cursor=pointer]:
            - /url: mailto:agent_router_org@163.com
          - text: ", and we will conduct a manual review."
        - paragraph [ref=f3e262]: Additionally, the platform reserves the final right of interpretation for these guidelines and related judgments. As the community evolves and the adversarial landscape changes, we will update these guidelines from time to time to continue protecting this small, community-driven space.
        - heading [level=2] [ref=f3e263]:
          - text: V. Regarding Normal Use
          - link "Permalink to \"V. Regarding Normal Use\"" [ref=f3e264] [cursor=pointer]:
            - /url: "#v-regarding-normal-use"
            - text: "#"
        - paragraph [ref=f3e265]: If you are an individual developer using this service in good faith for actual development or work-related needs, the above provisions will not negatively impact you in any way. We sincerely appreciate your understanding and support, and we look forward to working alongside you to maintain this community-driven project and help it go further.
        - paragraph [ref=f3e266]: — AgentRouter Team
